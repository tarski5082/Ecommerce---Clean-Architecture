<div class="products-grid">
    @for(product of productList();track product){
        <div class="product-card">
            <img [src]="product.imageUrl" [alt]="product.nom" class="product-image">
            <div class="product-info">
                <div class="product-name">{{product.nom}}</div>
            
                <div class="product-footer">
                    <div class="product-price">{{product.prixUnitaire}} EUR</div>
                    <button class="detail" (click)="onClick(product.id)">Detail</button>
                </div>
            </div>
        </div>
        
    }
</div>
